<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Exam Hub</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','ui-sans-serif','sans-serif'],mono:['"JetBrains Mono"','monospace']}}}}</script>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<style>
body{font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.pop{animation:pop .2s ease both}.live{animation:pulse 1.4s infinite}
::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
#sideDrawer{transition:transform .25s ease}#sideDrawer.closed{transform:translateX(-100%)}
input[type="date"]{color-scheme:light}
</style>
</head>
<body class="bg-slate-100 text-slate-900 text-[13px]">
<div id="app" class="min-h-screen"></div>
<script>
/* =====================================================================
   EXAM HUB v3.1 — Single-file SPA
   GV  : index.html → đăng nhập GV → dashboard
   SV  : index.html → đăng nhập / đăng ký (không cần QR)
         index.html?join=XX → đăng ký với mã lớp
         index.html?exam=XX → làm bài
   ===================================================================== */

const BACKEND_URL = "https://script.google.com/macros/s/AKfycbxIs_yD3WRbXxY2qi7FsiUfC55WMSYR_fGxyjDb-hppYPZVZ1Kw7BGG0xgaYR2qYyAEQw/exec";

/* ── Config ── */
const getUrl   = () => localStorage.getItem('eh_url') || BACKEND_URL;
const saveCfg  = u  => localStorage.setItem('eh_url', u);

/* ── Session ── */
function getSession(){try{return JSON.parse(localStorage.getItem('eh_sess')||'null');}catch(_){return null;}}
function setSession(s){localStorage.setItem('eh_sess',JSON.stringify(s));}
function clearSession(){localStorage.removeItem('eh_sess');}

/* ── API (text/plain avoids CORS preflight) ── */
async function api(action, payload={}, teacher=false) {
  const url=getUrl(); if(!url) throw new Error('Chưa cấu hình URL backend.');
  const sess=getSession();
  const token=teacher?(sess&&sess.role==='teacher'?sess.token:''):undefined;
  const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,token,payload})});
  const j=await res.json(); if(!j.ok) throw new Error(j.error||'Lỗi backend'); return j.data;
}

/* ── Helpers ── */
const $   = id => document.getElementById(id);
const esc = s  => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const clock = sec => { if(sec==null||sec==='') return '—'; sec=Math.max(0,+sec); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); };
const ago = iso => { if(!iso) return '—'; const d=Math.round((Date.now()-new Date(iso).getTime())/1000); if(d<5)return 'vừa xong';if(d<60)return d+'s trước';if(d<3600)return Math.floor(d/60)+'p trước';return Math.floor(d/3600)+'h trước'; };

/* ── Date helpers (store dd/mm/yyyy, HTML input needs yyyy-mm-dd) ── */
const toHtmlDate = v => {
  if(!v) return '';
  v=String(v).trim();
  if(v.includes('/')) { const p=v.split('/'); if(p.length===3) return `${p[2].padStart(4,'0')}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }
  return v; // already yyyy-mm-dd or unknown
};
const fromHtmlDate = v => {
  if(!v) return '';
  v=String(v).trim();
  if(v.includes('-')&&!v.includes('/')) { const p=v.split('-'); if(p.length===3) return `${p[2]}/${p[1]}/${p[0]}`; }
  return v; // already dd/mm/yyyy
};
function dateInp(id, val='') {
  return `<input id="${id}" type="date" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 focus:outline-none text-sm" value="${esc(toHtmlDate(val))}">`;
}
function icons(){if(window.lucide)window.lucide.createIcons();}
let _tt;
function toast(msg,type){let el=$('_t');if(!el){el=document.createElement('div');el.id='_t';document.body.appendChild(el);}const bg=type==='err'?'bg-red-600':type==='warn'?'bg-amber-500':'bg-slate-900';el.className=`fixed bottom-6 left-1/2 -translate-x-1/2 ${bg} text-white px-5 py-2.5 rounded-xl text-sm font-semibold shadow-2xl z-[200] max-w-[92vw] transition-all duration-300`;el.textContent=msg;el.style.opacity='1';el.style.transform='translate(-50%,0)';clearTimeout(_tt);_tt=setTimeout(()=>{el.style.opacity='0';el.style.transform='translate(-50%,16px)';},3200);}
function modal(html,wide){let o=$('_ov');if(!o){o=document.createElement('div');o.id='_ov';document.body.appendChild(o);o.addEventListener('click',e=>{if(e.target===o)closeModal();});}o.className='fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-start justify-center z-[100] p-4 pt-12 sm:pt-16 overflow-auto';o.innerHTML=`<div class="bg-white rounded-2xl border border-slate-200 shadow-2xl w-full ${wide?'max-w-3xl':'max-w-md'} pop">${html}</div>`;icons();}
function closeModal(){const o=$('_ov');if(o)o.remove();}
function mHead(t,back){return `<div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between"><h3 class="font-bold text-base">${t}</h3><button onclick="${back||'closeModal()'}" class="text-slate-400 text-2xl">×</button></div>`;}
function mFoot(...b){return `<div class="px-5 py-4 border-t border-slate-100 flex justify-end gap-2">${b.join('')}</div>`;}
function mBtn(l,a,s=''){return `<button onclick="${a}" class="px-4 py-2 rounded-xl text-xs font-bold ${s||'bg-indigo-600 hover:bg-indigo-700 text-white'}">${l}</button>`;}
function mBtnSec(l,a){return mBtn(l,a,'border border-slate-200 text-slate-600 hover:bg-slate-50');}
function inp(id,type,ph,val=''){return `<input id="${id}" type="${type}" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-200 focus:border-indigo-400 focus:outline-none text-sm" placeholder="${ph}" value="${esc(val)}">`;}

/* ── State ── */
const T={tab:'dashboard',classes:[],exams:[]};
const Room={examId:null,data:null,polling:true};
const S={exam:null,subId:null,answers:{},deadline:0,dur:0};
const M={on:false,paused:false,count:0,last:0};
let pollInt=null,tickInt=null,timerInt=null,saveT=null,saveInt=null,draft=[];

/* =====================================================================
   BOOT
   ===================================================================== */
function boot(){
  const p=new URLSearchParams(location.search);
  const examParam=p.get('exam'),joinParam=p.get('join');
  if(examParam!==null){stuExamView(examParam);return;}
  if(joinParam!==null){stuRegisterView(joinParam);return;}
  const sess=getSession();
  if(sess&&sess.role==='teacher'){teacherDash();return;}
  if(sess&&sess.role==='student'){sess.status==='active'?stuPortal():stuPendingPage(sess);return;}
  loginPage();
}

/* =====================================================================
   LOGIN PAGE
   ===================================================================== */
function loginPage(){
  $('app').innerHTML=`
  <div class="min-h-screen bg-gradient-to-br from-slate-900 via-slate-800 to-indigo-900 flex flex-col items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-extrabold text-2xl shadow-xl shadow-indigo-500/30 mx-auto mb-3">EH</div>
        <h1 class="text-3xl font-extrabold text-white tracking-tight">Exam Hub</h1>
        <p class="text-slate-400 text-sm mt-1">Hệ thống quản lý thi trực tuyến</p>
      </div>
      <div class="space-y-3">
        <button onclick="teacherLoginForm()" class="w-full flex items-center gap-4 px-5 py-4 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl transition-all shadow-lg shadow-indigo-500/20 group">
          <div class="w-10 h-10 bg-white/15 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="shield" class="w-5 h-5"></i></div>
          <div class="text-left"><div class="font-bold text-base">Đăng nhập Giáo viên</div><div class="text-indigo-200 text-xs">Quản lý lớp, đề thi và giám sát</div></div>
          <i data-lucide="chevron-right" class="w-4 h-4 ml-auto opacity-60 group-hover:opacity-100"></i>
        </button>
        <button onclick="stuLoginForm()" class="w-full flex items-center gap-4 px-5 py-4 bg-white/10 hover:bg-white/15 text-white rounded-2xl border border-white/10 group transition-all">
          <div class="w-10 h-10 bg-white/15 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="user" class="w-5 h-5"></i></div>
          <div class="text-left"><div class="font-bold text-base">Đăng nhập Sinh viên</div><div class="text-slate-300 text-xs">Email &amp; mật khẩu</div></div>
          <i data-lucide="chevron-right" class="w-4 h-4 ml-auto opacity-60 group-hover:opacity-100"></i>
        </button>
        <button onclick="stuDirectRegister()" class="w-full flex items-center gap-4 px-5 py-4 bg-white/5 hover:bg-white/10 text-white rounded-2xl border border-white/10 group transition-all">
          <div class="w-10 h-10 bg-emerald-500/20 rounded-xl flex items-center justify-center shrink-0"><i data-lucide="user-plus" class="w-5 h-5 text-emerald-400"></i></div>
          <div class="text-left"><div class="font-bold text-base">Đăng ký tài khoản SV</div><div class="text-slate-400 text-xs">Chưa có tài khoản? Đăng ký ngay</div></div>
          <i data-lucide="chevron-right" class="w-4 h-4 ml-auto opacity-60 group-hover:opacity-100"></i>
        </button>
      </div>
    </div>
  </div>`;
  icons();
}

/* ── Teacher login ── */
function teacherLoginForm(){
  modal(`${mHead('Đăng nhập Giáo viên')}
    <div class="p-5 space-y-3">
      <div class="flex items-center gap-3 p-3 bg-indigo-50 rounded-xl"><i data-lucide="shield" class="w-5 h-5 text-indigo-600 shrink-0"></i><p class="text-xs text-indigo-700">Nhập mật khẩu</p></div>
      <div><label class="block font-semibold mb-1 text-sm">Mật khẩu</label>${inp('_tp','password','Mật khẩu giáo viên…')}</div>
    </div>${mFoot(mBtnSec('Huỷ','closeModal()'),mBtn('Đăng nhập','doTeacherLogin()'))}`);
  setTimeout(()=>$('_tp')?.focus(),80);
  $('_tp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doTeacherLogin();});
}
async function doTeacherLogin(){
  const pwd=($('_tp')||{}).value?.trim();if(!pwd)return toast('Nhập mật khẩu','err');
  try{
    const url=getUrl();
    const res=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'listClasses',token:pwd,payload:{}})});
    const j=await res.json();if(!j.ok)throw new Error(j.error||'Sai mật khẩu');
    setSession({role:'teacher',token:pwd});closeModal();teacherDash();
  }catch(e){toast('Sai mật khẩu hoặc lỗi: '+e.message,'err');}
}

/* ── Student login ── */
function stuLoginForm(){
  modal(`${mHead('Đăng nhập Sinh viên')}
    <div class="p-5 space-y-3">
      <div><label class="block font-semibold mb-1 text-sm">Email</label>${inp('_se','email','email@example.com')}</div>
      <div><label class="block font-semibold mb-1 text-sm">Mật khẩu</label>${inp('_sp','password','Mật khẩu…')}</div>
    </div>
    <div class="px-5 pb-4 flex items-center justify-between">
      <button onclick="closeModal();stuDirectRegister()" class="text-indigo-600 text-xs hover:underline">Chưa có tài khoản? Đăng ký</button>
      <button onclick="closeModal();forgotPasswordModal()" class="text-slate-400 text-xs hover:text-slate-600 hover:underline">Quên mật khẩu?</button>
    </div>
    ${mFoot(mBtnSec('Huỷ','closeModal()'),mBtn('Đăng nhập','doStuLogin()'))}`);
  setTimeout(()=>$('_se')?.focus(),80);
  $('_sp')?.addEventListener('keydown',e=>{if(e.key==='Enter')doStuLogin();});
}
async function doStuLogin(){
  const email=($('_se')||{}).value?.trim(),pwd=($('_sp')||{}).value?.trim();
  if(!email||!pwd)return toast('Điền email và mật khẩu','err');
  try{const r=await api('studentLogin',{email,password:pwd});setSession({role:'student',...r});closeModal();r.status==='active'?stuPortal():stuPendingPage(r);}
  catch(e){toast(e.message,'err');}
}

/* ── Forgot password ── */
function forgotPasswordModal(){
  modal(`${mHead('Quên mật khẩu')}
    <div class="p-5 space-y-3">
      <p class="text-sm text-slate-500">Nhập email đăng ký. Hệ thống sẽ gửi mật khẩu tạm thời qua email.</p>
      <div><label class="block font-semibold mb-1 text-sm">Email</label>${inp('_fe','email','email@example.com')}</div>
    </div>${mFoot(mBtnSec('Huỷ','closeModal()'),mBtn('Gửi mật khẩu','doForgotPassword()'))}`);
  setTimeout(()=>$('_fe')?.focus(),80);
}
async function doForgotPassword(){
  const email=($('_fe')||{}).value?.trim();if(!email)return toast('Nhập email','err');
  try{await api('forgotPassword',{email});closeModal();toast('Đã gửi mật khẩu tạm thời vào email ✓');}
  catch(e){toast(e.message,'err');}
}

/* ── Student self-register (no QR) ── */
function stuDirectRegister(classCode){
  const classCodeHtml = classCode
    ? `<div><label class="block font-semibold mb-1 text-sm">Mã lớp (đã điền sẵn)</label><input id="_rc" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl bg-slate-50 font-mono text-sm" value="${esc(classCode)}" readonly></div>`
    : `<div class="flex items-start gap-2 bg-blue-50 border border-blue-200 rounded-xl p-3 text-xs text-blue-700"><i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0"></i><span>Không cần mã lớp. Sau khi đăng ký, bạn sẽ chờ giáo viên thêm MSSV của bạn vào lớp — hệ thống tự động kết nối.</span></div><div><label class="block font-semibold mb-1 text-sm">Mã lớp (không bắt buộc)</label>${inp('_rc','text','Dán mã lớp nếu có')}</div>`;
  modal(`${mHead('Đăng ký tài khoản Sinh viên','loginPage()')}
    <div class="p-5 space-y-3">
      <div class="grid grid-cols-2 gap-3">
        <div class="col-span-2"><label class="block font-semibold mb-1 text-sm">Họ và tên *</label>${inp('_rn','text','Nguyễn Văn A')}</div>
        <div><label class="block font-semibold mb-1 text-sm">SBD / MSSV *</label>${inp('_rs','text','65666362')}</div>
        <div><label class="block font-semibold mb-1 text-sm">Ngày sinh</label>${dateInp('_rd')}</div>
        <div class="col-span-2"><label class="block font-semibold mb-1 text-sm">Email *</label>${inp('_re','email','sv@email.com')}</div>
        <div class="col-span-2"><label class="block font-semibold mb-1 text-sm">Mật khẩu *</label>${inp('_rp2','password','Mật khẩu để đăng nhập lần sau')}</div>
      </div>
      ${classCodeHtml}
    </div>${mFoot(mBtnSec('Đã có tài khoản','closeModal();stuLoginForm()'),mBtn('Đăng ký','doDirectRegister()'))}`);
  if(classCode && $('_rc')) $('_rc').value=classCode;
  setTimeout(()=>$('_rn')?.focus(),80);
}
async function doDirectRegister(){
  const fullName=$('_rn')?.value?.trim(),sbd=$('_rs')?.value?.trim(),dob=fromHtmlDate($('_rd')?.value||''),email=$('_re')?.value?.trim(),password=$('_rp2')?.value?.trim();
  const classCode=($('_rc')?.value||'').trim();
  if(!fullName||!sbd||!email||!password)return toast('Điền đầy đủ thông tin (*)','err');
  try{
    const r=await api('studentRegister',{classCode:classCode||undefined,fullName,sbd,dob,email,password});
    setSession({role:'student',...r});
    closeModal();
    if(r.status==='active'){toast('Đăng ký thành công! Chào '+r.fullName+'');stuPortal();}
    else stuPendingPage(r);
  }catch(e){toast(e.message,'err');}
}

/* =====================================================================
   TEACHER SHELL
   ===================================================================== */
function teacherDash(){
  clearInterval(pollInt);clearInterval(tickInt);
  $('app').innerHTML=`
  <div class="flex min-h-screen">
    <aside id="sideDrawer" class="fixed inset-y-0 left-0 z-40 w-60 bg-[#0F172A] flex flex-col lg:static lg:z-auto">
      <div class="p-4 flex items-center gap-3 border-b border-slate-800">
        <div class="w-9 h-9 bg-indigo-500 rounded-xl flex items-center justify-center text-white font-extrabold text-base">EH</div>
        <div><div class="font-bold text-white text-sm">Exam Hub</div><div class="text-indigo-400 text-[10px] uppercase tracking-widest">Giáo viên</div></div>
        <button onclick="closeSidebar()" class="ml-auto text-slate-500 hover:text-slate-300 lg:hidden"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <nav class="flex-1 p-3 space-y-1">
        <div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 py-2">Quản lý &amp; Giám sát</div>
        ${navItem('dashboard','layout-dashboard','Bàn làm việc')}
        ${navItem('create','file-plus-2','Tạo đề thi')}
        ${navItem('room','monitor-dot','Quản lý phòng thi')}
      </nav>
      <div class="p-3 border-t border-slate-800 space-y-1">
        <button onclick="logout()" class="w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-slate-400 hover:bg-red-900/30 hover:text-red-400 text-xs"><i data-lucide="log-out" class="w-4 h-4"></i>Đăng xuất</button>
      </div>
    </aside>
    <div id="sideOverlay" class="hidden fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="closeSidebar()"></div>
    <main class="flex-1 min-w-0 flex flex-col" id="main"></main>
  </div>`;
  icons();goTab(T.tab);
  pollInt=setInterval(()=>{if(T.tab==='room'&&Room.polling&&Room.examId)pollRoom();},8000);
  tickInt=setInterval(()=>{if(T.tab==='room')roomTick();},1000);
}
function navItem(id,icon,label){const a=T.tab===id?'bg-indigo-600/15 text-indigo-300 font-semibold border-l-2 border-indigo-500':'text-slate-400 hover:bg-slate-800/60 hover:text-slate-200';return `<a href="#" onclick="goTab('${id}');return false" class="flex items-center gap-3 px-3 py-2 rounded-lg ${a} text-xs transition-all"><i data-lucide="${icon}" class="w-4 h-4 text-indigo-400 shrink-0"></i><span>${label}</span></a>`;}
function goTab(tab){T.tab=tab;clearInterval(pollInt);clearInterval(tickInt);const aside=document.querySelector('aside nav');if(aside){aside.innerHTML=`<div class="text-[10px] font-bold text-slate-500 uppercase tracking-widest px-3 py-2">Quản lý &amp; Giám sát</div>${navItem('dashboard','layout-dashboard','Bàn làm việc')}${navItem('create','file-plus-2','Tạo đề thi')}${navItem('room','monitor-dot','Quản lý phòng thi')}`;icons();}closeSidebar();if(tab==='dashboard')loadDashboard();else if(tab==='create')loadCreate();else if(tab==='room')loadRoom();}
function openSidebar(){$('sideDrawer')?.classList.remove('closed');$('sideOverlay')?.classList.remove('hidden');}
function closeSidebar(){if(window.innerWidth<1024){$('sideDrawer')?.classList.add('closed');$('sideOverlay')?.classList.add('hidden');}}
window.addEventListener('resize',()=>{if(window.innerWidth>=1024){$('sideDrawer')?.classList.remove('closed');$('sideOverlay')?.classList.add('hidden');}});
function initSidebar(){if(window.innerWidth<1024)$('sideDrawer')?.classList.add('closed');}
function pageHeader(t,s){return `<header class="bg-white border-b border-slate-200 px-4 lg:px-7 py-4 flex items-center gap-3 sticky top-0 z-10"><button onclick="openSidebar()" class="lg:hidden text-slate-500 -ml-1"><i data-lucide="menu" class="w-5 h-5"></i></button><div><h1 class="text-base lg:text-lg font-bold text-slate-800">${t}</h1><p class="text-slate-400 text-xs hidden sm:block">${s}</p></div></header>`;}
function statCard(icon,label,val,col){return `<div class="bg-white rounded-xl border border-slate-200 p-4"><div class="flex items-center justify-between mb-1"><span class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">${label}</span><i data-lucide="${icon}" class="w-4 h-4 ${col}"></i></div><div class="text-2xl font-extrabold font-mono text-slate-800">${val}</div></div>`;}
function logout(){if(!confirm('Đăng xuất?'))return;clearSession();loginPage();}

/* =====================================================================
   TAB: DASHBOARD
   ===================================================================== */
function loadDashboard(){
  $('main').innerHTML=`${pageHeader('Bàn làm việc','Tổng quan lớp học, đề thi và sinh viên')}
  <div class="p-4 lg:p-7 space-y-6">
    <div id="stats" class="grid grid-cols-2 lg:grid-cols-4 gap-3"></div>
    <div class="grid lg:grid-cols-5 gap-4 lg:gap-6">

function mcEditor(q,i){return `<div class="space-y-2">${q.options.map((o,oi)=>`<div class="flex items-center gap-2"><input type="radio" name="cr${i}" ${q.correctIndex===oi?'checked':''} onchange="qUpd(${i},'correctIndex',${oi})" class="w-4 h-4 accent-emerald-600 shrink-0"><input value="${esc(o)}" oninput="qOpt(${i},${oi},this.value)" class="flex-1 px-3 py-1.5 border border-slate-200 rounded-xl focus:ring-1 focus:ring-indigo-500 focus:outline-none text-sm" placeholder="Phương án ${String.fromCharCode(65+oi)}">${q.options.length>2?`<button onclick="delOpt(${i},${oi})" class="text-slate-300 hover:text-red-500 shrink-0"><i data-lucide="x" class="w-4 h-4"></i></button>`:''}</div>`).join('')}</div><button onclick="addOpt(${i})" class="mt-2 text-xs text-indigo-600 font-semibold">+ thêm phương án</button>`;}
function fillEditor(q,i){return `<label class="block text-xs font-semibold text-slate-600 mb-1">Đáp án chấp nhận (mỗi dòng 1)</label><textarea oninput="qAcc(${i},this.value)" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-mono text-xs focus:ring-2 focus:ring-indigo-200 focus:outline-none" rows="2" placeholder="personality&#10;personalities">${esc((q.accepted||[]).join('\n'))}</textarea><label class="flex items-center gap-2 mt-2 text-slate-600 text-xs"><input type="checkbox" ${q.caseSensitive?'checked':''} onchange="qUpd(${i},'caseSensitive',this.checked)" class="w-4 h-4 accent-indigo-600">Phân biệt hoa/thường</label>`;}
function qUpd(i,k,v){if(k==='points')v=parseFloat(v)||0;if(k==='correctIndex')v=+v;draft[i][k]=v;}
function qOpt(i,oi,v){draft[i].options[oi]=v;}
function qAcc(i,v){draft[i].accepted=v.split(/\r?\n/).map(s=>s.trim()).filter(Boolean)||[''];}
function addOpt(i){draft[i].options.push('');renderDraft();}
function delOpt(i,oi){draft[i].options.splice(oi,1);if(draft[i].correctIndex>=draft[i].options.length)draft[i].correctIndex=0;renderDraft();}
function delQ(i){draft.splice(i,1);renderDraft();}
async function saveExam(){const name=($('_en')||{}).value?.trim();if(!name)return toast('Nhập tên đề','err');if(!draft.length)return toast('Chưa có câu hỏi','err');for(const q of draft){if(!q.text.trim())return toast('Có câu hỏi trống','err');if(q.type==='fill'&&!q.accepted?.some(a=>a.trim()))return toast('Câu điền từ chưa có đáp án','err');if(q.type==='mc'&&q.options.some(o=>!o.trim()))return toast('Phương án trắc nghiệm còn trống','err');}try{const r=await api('createExam',{examName:name,classId:$('_ecl')?.value||'',durationMin:+($('_ed')?.value||0),mode:$('_em')?.value||'test',maxAttempts:+($('_ea')?.value||1),shuffle:$('_es')?.checked||false,questions:draft.map(q=>({...q,accepted:q.type==='fill'?q.accepted?.filter(a=>a.trim()):undefined}))},true);examDoneModal(r.examCode,name);}catch(e){toast(e.message,'err');}}
function examDoneModal(code,name){const link=location.origin+location.pathname+'?exam='+code;modal(`<div class="p-6 text-center"><div class="w-14 h-14 rounded-full bg-emerald-50 flex items-center justify-center mx-auto mb-3"><i data-lucide="check" class="w-7 h-7 text-emerald-600"></i></div><h3 class="font-bold text-lg text-slate-800">Đề đã tạo!</h3><p class="text-slate-500 mb-4">${esc(name)}</p><div class="bg-slate-50 rounded-xl p-4 space-y-3 text-left"><div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Mã đề</label><div class="font-mono text-2xl font-bold text-center tracking-widest">${esc(code)}</div></div><div><label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Link SV</label><input readonly onclick="this.select()" value="${esc(link)}" class="w-full px-3 py-2 border border-slate-200 rounded-xl font-mono text-xs bg-white"></div></div><div class="flex gap-2 mt-4"><button onclick="navigator.clipboard.writeText('${esc(link)}').then(()=>toast('Đã copy ✓'))" class="flex-1 px-3 py-2.5 bg-indigo-600 text-white rounded-xl text-xs font-bold">Copy link</button><button onclick="closeModal();draft=[];loadCreate()" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-xl text-xs font-bold">Đề khác</button><button onclick="closeModal();goTab('room')" class="flex-1 px-3 py-2.5 bg-slate-800 text-white rounded-xl text-xs font-bold">Phòng thi</button></div></div>`);}

function loadRoom(){Room.examId=null;Room.data=null;Room.polling=true;$('main').innerHTML=`${pageHeader('Quản lý phòng thi','Giám sát tiến độ & màn hình theo thời gian thực')}<div class="p-4 lg:p-7 space-y-5"><div class="flex flex-wrap items-center gap-3"><select id="_rp" onchange="selectRoom(this.value)" class="flex-1 min-w-0 px-3 py-2 border border-slate-200 rounded-xl bg-white text-sm focus:ring-2 focus:ring-indigo-200 focus:outline-none"></select><div class="flex items-center gap-2 shrink-0"><span id="_ld" class="flex items-center gap-1.5 text-[11px] font-semibold text-emerald-600"><span class="w-2 h-2 rounded-full bg-emerald-500 live"></span>Đang cập nhật</span><button id="_pb" onclick="togglePoll()" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-50 flex items-center gap-1.5"><i data-lucide="pause" class="w-3.5 h-3.5"></i>Tạm dừng</button><button onclick="exportCSV()" class="px-3 py-1.5 border border-slate-200 rounded-xl text-xs font-semibold hover:bg-slate-50 flex items-center gap-1.5"><i data-lucide="download" class="w-3.5 h-3.5"></i>CSV</button></div></div><div id="_rc" class="grid grid-cols-3 sm:grid-cols-6 gap-2"></div><div class="grid lg:grid-cols-4 gap-4"><div class="lg:col-span-3 bg-white rounded-xl border border-slate-200 overflow-hidden"><div id="_rt" class="overflow-x-auto"></div></div><div class="bg-white rounded-xl border border-slate-200 flex flex-col"><div class="px-4 py-3 border-b border-slate-100 font-bold text-slate-700 flex items-center gap-2 text-sm"><i data-lucide="activity" class="w-4 h-4 text-indigo-500"></i>Nhật ký</div><div id="_rf" class="p-2 space-y-1 flex-1 overflow-auto" style="max-height:60vh"></div></div></div></div>`;

function rCard(l,v,c){return `<div class="bg-white rounded-xl border border-slate-200 p-3"><div class="text-[10px] font-bold text-slate-400 uppercase tracking-wider truncate">${l}</div><div class="text-xl font-extrabold font-mono mt-0.5 ${c}">${v}</div></div>`;}

function sbadge(st){if(st==='submitted')return '<span class="text-[10px] font-bold text-emerald-700 bg-emerald-100 px-1.5 py-0.5 rounded-full">✓ Đã nộp</span>';if(st==='in_progress')return '<span class="inline-flex items-center gap-1 text-[10px] font-bold text-sky-700 bg-sky-100 px-1.5 py-0.5 rounded-full"><span class="w-1.5 h-1.5 rounded-full bg-sky-500 live"></span>Đang làm</span>';return '<span class="text-[10px] font-bold text-slate-400 bg-slate-100 px-1.5 py-0.5 rounded-full">Chưa làm</span>';}
function wbadge(n){if(n>=3)return `<span class="text-[10px] font-bold text-red-700 bg-red-100 px-1.5 py-0.5 rounded-full">⚠ ${n}x</span>`;if(n>0)return `<span class="text-[10px] font-bold text-amber-700 bg-amber-100 px-1.5 py-0.5 rounded-full">${n}x</span>`;return '<span class="text-[10px] text-emerald-600">✓</span>';}
function renderRoomTable(){const d=Room.data;if(!d||!d.rows.length){$('_rt').innerHTML='<div class="text-center py-16 text-slate-400">Chưa có SV.</div>';return;}$('_rt').innerHTML=`<table class="w-full text-xs lg:text-[13px]"><thead><tr class="text-[10px] uppercase text-slate-400 bg-slate-50 border-b border-slate-200"><th class="text-left px-3 py-2.5">SBD</th><th class="text-left">Họ tên</th><th class="text-left">TT</th><th class="text-left px-2">Tiến độ</th><th class="text-left">Còn lại</th><th class="text-left">Điểm</th><th class="text-left">Giám sát</th><th class="text-left">Cuối</th><th></th></tr></thead><tbody>${d.rows.map(r=>{const pct=r.totalQuestions?Math.round(r.progress/r.totalQuestions*100):0;const tEl=r.status==='submitted'?'<span class="text-emerald-600 font-mono">✓</span>':r.status!=='in_progress'?'<span class="text-slate-300">—</span>':d.durationMin===0?'∞':`<span id="t_${r.submissionId}" class="font-mono font-bold ${r.remainingTime<=60?'text-red-600':'text-slate-700'}">${clock(r.remainingTime)}</span>`;return `<tr class="border-b border-slate-50 hover:bg-slate-50/60 ${r.tabSwitches>=3?'bg-red-50/40':''}"><td class="px-3 py-2.5 font-mono text-slate-500">${esc(r.sbd||'—')}</td><td class="font-semibold text-slate-700 max-w-[120px] truncate">${esc(r.fullName)}</td><td>${sbadge(r.status)}</td><td class="px-2 w-32"><div class="flex items-center gap-1.5"><div class="flex-1 h-1.5 bg-slate-100 rounded-full overflow-hidden"><div class="h-full ${pct>=100?'bg-emerald-500':'bg-indigo-500'}" style="width:${pct}%"></div></div><span class="font-mono text-[10px] text-slate-400 w-10 text-right">${r.progress}/${r.totalQuestions}</span></div></td><td>${tEl}</td><td class="font-mono font-bold ${r.status==='submitted'?'text-slate-800':'text-slate-300'}">${r.status==='submitted'?r.score:'—'}</td><td>${wbadge(r.tabSwitches)}</td><td class="text-slate-400 text-[10px]">${ago(r.lastSeen)}</td><td class="text-right pr-3 whitespace-nowrap">${r.tabSwitches>0?`<button onclick="resetW('${r.submissionId}')" class="text-[11px] text-amber-600 hover:underline mr-1">Xoá CB</button>`:''}${r.status==='submitted'?`<button onclick="reviewModal('${r.submissionId}')" class="text-[11px] text-indigo-600 hover:underline">Xem bài</button>`:''}</td></tr>`;}).join('')}</tbody></table>`;icons();}
function renderFeed(ev){const h=$('_rf');if(!h)return;if(!ev.length){h.innerHTML='<div class="text-center text-slate-400 py-6 text-xs">Chưa có hoạt động.</div>';return;}const ic={start:['log-in','text-slate-400'],submit:['check-circle-2','text-emerald-500'],leave_screen:['eye-off','text-red-500'],tab_switch:['eye-off','text-red-500'],blur:['eye-off','text-amber-500'],fullscreen_exit:['minimize-2','text-amber-500']};h.innerHTML=ev.map(e=>{const[i,col]=ic[e.type]||['dot','text-slate-400'];return `<div class="flex gap-2 px-2 py-1.5 rounded-lg hover:bg-slate-50"><i data-lucide="${i}" class="w-3.5 h-3.5 mt-0.5 shrink-0 ${col}"></i><div class="min-w-0"><div class="text-[11px] text-slate-700 leading-snug"><b>${esc(e.studentName||'')}</b> ${esc(e.detail)}${e.count?` <b class="text-red-500">(${e.count})</b>`:''}</div><div class="text-[10px] text-slate-400">${ago(e.ts)}</div></div></div>`;}).join('');icons();}
function roomTick(){if(!Room.data||!Room.polling||!Room.data.durationMin)return;Room.data.rows.forEach(r=>{if(r.status==='in_progress'&&r.remainingTime>0){r.remainingTime--;const el=$('t_'+r.submissionId);if(el){el.textContent=clock(r.remainingTime);if(r.remainingTime<=60)el.className='font-mono font-bold text-red-600';}}});}
function togglePoll(){Room.polling=!Room.polling;const b=$('_pb'),d=$('_ld');if(!b||!d)return;b.innerHTML=Room.polling?'<i data-lucide="pause" class="w-3.5 h-3.5"></i>Tạm dừng':'<i data-lucide="play" class="w-3.5 h-3.5"></i>Tiếp tục';d.className=`flex items-center gap-1.5 text-[11px] font-semibold ${Room.polling?'text-emerald-600':'text-slate-400'}`;d.innerHTML=Room.polling?'<span class="w-2 h-2 rounded-full bg-emerald-500 live"></span>Đang cập nhật':'<span class="w-2 h-2 rounded-full bg-slate-400"></span>Đã tạm dừng';icons();if(Room.polling)pollRoom();}

async function reviewModal(sid){modal('<div class="p-10 text-center text-slate-400">Đang tải…</div>',true);try{const d=await api('getSubmission',{submissionId:sid},true);const per={};(d.result?.perQuestion||[]).forEach(p=>per[p.qid]=p);const correct=(d.result?.perQuestion||[]).filter(p=>p.correct).length;modal(`<div class="px-5 py-4 border-b border-slate-100 flex justify-between items-center"><div><h3 class="font-bold text-base">${esc(d.studentName)}</h3><p class="text-slate-400 text-xs">SBD ${esc(d.sbd||'—')} · ${clock(d.timeSpentSec)} · vi phạm: ${d.tabSwitches}</p></div><button onclick="closeModal()" class="text-slate-400 text-2xl">×</button></div><div class="p-5 max-h-[70vh] overflow-auto"><div class="grid grid-cols-3 gap-3 mb-5"><div class="bg-indigo-50 rounded-xl p-3 text-center"><div class="text-[10px] font-bold text-indigo-400 uppercase">Điểm</div><div class="text-2xl font-extrabold text-indigo-700 font-mono">${d.score}<span class="text-sm text-indigo-300">/10</span></div></div><div class="bg-emerald-50 rounded-xl p-3 text-center"><div class="text-[10px] font-bold text-emerald-400 uppercase">Đúng</div><div class="text-2xl font-extrabold text-emerald-700 font-mono">${correct}/${d.questions?.length||0}</div></div><div class="bg-slate-50 rounded-xl p-3 text-center"><div class="text-[10px] font-bold text-slate-400 uppercase">Thời gian</div><div class="text-2xl font-extrabold text-slate-700 font-mono">${clock(d.timeSpentSec)}</div></div></div>${(d.questions||[]).map((q,i)=>{const p=per[q.id],ok=p&&p.correct,given=p?p.given:'';let body;if(q.type==='mc'){const gi=given===''||given==null?-1:+given;body=`<div class="mt-1 text-xs">SV chọn: <span class="px-2 py-0.5 rounded font-semibold ${ok?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}">${gi>=0&&q.options?esc(q.options[gi]):'(bỏ trống)'}</span>${!ok?`<span class="ml-2 text-emerald-600 font-semibold">✓ ${esc(q.options?q.options[q.correctIndex]:'')}</span>`:''}</div>`;}else{body=`<div class="mt-1 text-xs">SV nhập: <span class="px-2 py-0.5 rounded font-semibold ${ok?'bg-emerald-100 text-emerald-700':'bg-red-100 text-red-700'}">${given?esc(given):'(bỏ trống)'}</span>${!ok?`<span class="ml-2 text-emerald-600 font-semibold">✓ ${esc((q.accepted||[]).join('|'))}</span>`:''}</div>`;}return `<div class="py-3 border-b border-slate-100"><div class="flex justify-between text-xs"><b class="text-indigo-600 font-mono">Câu ${i+1}</b><span class="text-slate-400">${p?p.earned:0}/${p?p.points:(q.points||1)}đ</span></div><div class="text-sm text-slate-700 mt-0.5 whitespace-pre-wrap">${esc(q.text)}</div>${body}</div>`;}).join('')}</div>`,true);}catch(e){toast(e.message,'err');closeModal();}}
function exportCSV(){if(!Room.data||!Room.data.rows.length)return toast('Không có dữ liệu','err');const h=['SBD','Họ tên','Trạng thái','Tiến độ','Tổng câu','Điểm','Vi phạm'],st={submitted:'Đã nộp',in_progress:'Đang làm',not_started:'Chưa làm'};const rows=Room.data.rows.map(r=>[r.sbd,r.fullName,st[r.status]||r.status,r.progress,r.totalQuestions,r.status==='submitted'?r.score:'',r.tabSwitches]);const csv='\uFEFF'+[h.join(','),...rows.map(r=>r.map(c=>`"${String(c==null?'':c).replace(/"/g,'""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='phongthi_'+(Room.data.examCode||'export')+'.csv';a.click();}

    const s=d.student;
    $('app').innerHTML=`
    <div class="min-h-screen bg-slate-100">
      <header class="bg-[#0F172A] text-white px-4 py-3 flex items-center justify-between sticky top-0 z-10">
        <div class="flex items-center gap-3">
          <div class="w-8 h-8 bg-indigo-500 rounded-lg flex items-center justify-center font-bold text-sm">EH</div>
          <div><div class="font-bold text-sm">${esc(s.fullName)}</div><div class="text-indigo-300 text-[10px]">${esc(d.className||'Chưa phân lớp')} · MSSV ${esc(s.sbd)}</div></div>
        </div>
        <div class="flex items-center gap-2">
          <button onclick="stuSettingsModal()" class="flex items-center gap-1.5 text-slate-400 hover:text-white text-xs px-2 py-1.5 rounded-lg hover:bg-slate-800/60"><i data-lucide="settings" class="w-4 h-4"></i><span class="hidden sm:inline">Cài đặt</span></button>
          <button onclick="clearSession();loginPage()" class="flex items-center gap-1.5 text-slate-400 hover:text-white text-xs px-2 py-1.5 rounded-lg hover:bg-red-900/30 hover:text-red-400"><i data-lucide="log-out" class="w-4 h-4"></i><span class="hidden sm:inline">Đăng xuất</span></button>
        </div>
      </header>
      <div class="max-w-2xl mx-auto p-4 space-y-4">
        <h2 class="font-bold text-slate-800 text-base mt-2">Đề thi của bạn</h2>
        ${d.examList&&d.examList.length?d.examList.map(e=>`
          <div class="bg-white rounded-xl border border-slate-200 p-4 flex items-center gap-4">
            <div class="w-10 h-10 rounded-xl ${e.submitted?'bg-emerald-50':'bg-indigo-50'} flex items-center justify-center shrink-0"><i data-lucide="${e.submitted?'check-circle-2':'file-text'}" class="w-5 h-5 ${e.submitted?'text-emerald-600':'text-indigo-500'}"></i></div>
            <div class="flex-1 min-w-0"><div class="font-bold text-slate-800 text-sm">${esc(e.examName)}</div><div class="text-xs text-slate-400">${e.questionCount} câu${e.durationMin?' · '+e.durationMin+' phút':''}</div></div>
            ${e.submitted
              ? `<div class="text-right shrink-0"><div class="text-2xl font-extrabold font-mono ${+e.score>=5?'text-emerald-600':'text-red-500'}">${e.score}</div><div class="text-[10px] text-slate-400">/10</div></div>`
              : `<a href="?exam=${e.examCode}" class="shrink-0 px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl text-xs font-bold">${e.inProgress?'Tiếp tục':'Làm bài'}</a>`}
          </div>`).join('')
        :'<div class="text-center py-12 text-slate-400 bg-white rounded-xl border border-slate-200">Giáo viên chưa giao đề thi.</div>'}

    </div>`;icons();
  }catch(e){toast(e.message,'err');}
}

/* ── Student Settings ── */
function stuSettingsModal(){
  const sess=getSession();if(!sess)return;
  modal(`${mHead('Cài đặt tài khoản')}
    <div class="p-5 space-y-3">
      <p class="text-xs text-slate-500">Chỉnh sửa thông tin cá nhân. Để đổi mật khẩu, điền đầy đủ mục bên dưới.</p>
      <div><label class="block font-semibold mb-1 text-sm">Họ tên</label>${inp('_pn','text','Họ và tên',sess.fullName||'')}</div>
      <div class="grid grid-cols-2 gap-3">
        <div><label class="block font-semibold mb-1 text-sm">Ngày sinh</label>${dateInp('_pd', sess.dob||'')}</div>
        <div><label class="block font-semibold mb-1 text-sm">SĐT</label>${inp('_pp','tel','SĐT',sess.phone||'')}</div>
      </div>
      <hr class="border-slate-100">
      <p class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Đổi mật khẩu (không bắt buộc)</p>
      <div><label class="block font-semibold mb-1 text-sm">Mật khẩu hiện tại</label>${inp('_pc','password','Mật khẩu hiện tại')}</div>
      <div><label class="block font-semibold mb-1 text-sm">Mật khẩu mới</label>${inp('_pnew','password','Mật khẩu mới')}</div>
    </div>${mFoot(mBtnSec('Huỷ','closeModal()'),mBtn('Lưu thay đổi','doUpdateProfile()'))}`);
}
async function doUpdateProfile(){
  const sess=getSession();if(!sess)return;
  const fullName=($('_pn')||{}).value?.trim();
  const dob=fromHtmlDate(($('_pd')||{}).value||'');
  const phone=($('_pp')||{}).value?.trim()||'';
  const currentPassword=($('_pc')||{}).value?.trim();
  const newPassword=($('_pnew')||{}).value?.trim();
  if(newPassword&&!currentPassword)return toast('Nhập mật khẩu hiện tại để đổi','err');
  try{
    await api('updateStudentProfile',{studentId:sess.studentId,fullName,dob,phone,currentPassword:currentPassword||undefined,newPassword:newPassword||undefined});
    setSession({...sess,fullName:fullName||sess.fullName,dob,phone});
    closeModal();toast('Đã cập nhật thông tin ✓');stuPortal();
  }catch(e){toast(e.message,'err');}
}

function stuRegisterView(classCode){
  $('app').innerHTML=`
  <div class="min-h-screen bg-gradient-to-br from-slate-900 to-indigo-950 flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm pop">
      <div class="bg-indigo-600 rounded-t-2xl px-5 py-4 text-white">
        <div class="font-bold text-lg">Đăng ký qua QR</div>
        <div class="text-indigo-200 text-xs">Mã lớp: <span class="font-mono font-bold">${esc(classCode)}</span></div>
      </div>
      <div class="p-5 space-y-3">
        <div><label class="block text-sm font-semibold mb-1">Họ tên *</label>${inp('_rn','text','Nguyễn Văn A')}</div>
        <div class="grid grid-cols-2 gap-3">
          <div><label class="block text-sm font-semibold mb-1">SBD/MSSV *</label>${inp('_rs','text','65666362')}</div>
          <div><label class="block text-sm font-semibold mb-1">Ngày sinh</label>${dateInp('_rd')}</div>
        </div>
        <div><label class="block text-sm font-semibold mb-1">Email *</label>${inp('_re','email','sv@email.com')}</div>
        <div><label class="block text-sm font-semibold mb-1">Mật khẩu *</label>${inp('_rp2','password','Để đăng nhập lần sau')}</div>
        <div class="bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-700 flex items-start gap-2"><i data-lucide="info" class="w-4 h-4 mt-0.5 shrink-0"></i>Nếu MSSV đã có trong danh sách lớp, bạn vào lớp ngay. Nếu chưa, bạn chờ giáo viên duyệt.</div>
      </div>
      <div class="px-5 pb-5"><button onclick="doRegisterQR('${classCode}')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold text-sm">Đăng ký tham gia</button>
      <button onclick="loginPage()" class="w-full py-2 mt-2 text-slate-400 hover:text-slate-600 text-xs">Đã có tài khoản? Đăng nhập</button></div>
    </div>
  </div>`;icons();
}
async function doRegisterQR(classCode){
  if(!getUrl()){toast('Chưa cấu hình backend','err');return;}
  const fullName=$('_rn')?.value?.trim(),sbd=$('_rs')?.value?.trim(),dob=fromHtmlDate($('_rd')?.value||''),email=$('_re')?.value?.trim(),password=$('_rp2')?.value?.trim();
  if(!fullName||!sbd||!email||!password)return toast('Điền đầy đủ (*)','err');
  try{const r=await api('studentRegister',{classCode,fullName,sbd,dob,email,password});setSession({role:'student',...r});if(r.status==='active'){toast('Đăng ký thành công!');stuPortal();}else stuPendingPage(r);}
  catch(e){toast(e.message,'err');}
}

/* =====================================================================
   STUDENT — EXAM TAKER
   ===================================================================== */
function stuExamView(code){
  $('app').className='min-h-screen bg-slate-50';
  if(!code){stuCodeEntry();return;}
  $('app').innerHTML='<div class="min-h-screen flex items-center justify-center"><div class="text-slate-400">Đang tải đề…</div></div>';
  api('getExamByCode',{examCode:code}).then(exam=>{S.exam=exam;S.dur=exam.durationMin;stuEntry(code);}).catch(e=>{$('app').innerHTML=`<div class="min-h-screen flex items-center justify-center px-4"><div class="bg-white rounded-2xl border p-8 text-center max-w-sm w-full"><div class="text-4xl mb-2">🔒</div><h2 class="font-bold text-xl text-slate-800">Không vào được đề</h2><p class="text-slate-500 mt-1">${esc(e.message)}</p><button onclick="stuCodeEntry()" class="mt-4 px-4 py-2 bg-indigo-600 text-white rounded-xl text-sm font-bold">Nhập mã khác</button></div></div>`;});
}
function stuCodeEntry(){$('app').innerHTML=`<div class="min-h-screen bg-gradient-to-br from-slate-900 to-indigo-950 flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm pop p-7 text-center"><div class="w-14 h-14 bg-indigo-500 rounded-2xl flex items-center justify-center text-white font-extrabold text-xl mx-auto mb-3">EH</div><h1 class="text-xl font-extrabold text-slate-800 mb-1">Làm bài thi</h1><p class="text-slate-400 text-sm mb-5">Nhập mã đề</p><input id="_ec" class="w-full px-4 py-3 border border-slate-200 rounded-xl font-mono text-center text-xl tracking-widest uppercase focus:ring-2 focus:ring-indigo-200 focus:outline-none mb-3" placeholder="XXXXXX" maxlength="10"><button onclick="const c=$('_ec')?.value?.trim()?.toLowerCase();if(c){history.replaceState({},'','?exam='+c);stuExamView(c);}else toast('Nhập mã đề','err')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold">Tìm đề →</button><button onclick="loginPage()" class="mt-3 text-slate-400 text-xs hover:text-slate-600">← Trang chủ</button></div></div>`;icons();setTimeout(()=>$('_ec')?.focus(),100);}
function stuEntry(code){
  $('app').innerHTML=`<div class="min-h-screen flex items-center justify-center px-4 py-8 bg-gradient-to-br from-slate-900 to-indigo-950"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-md pop"><div class="bg-indigo-600 rounded-t-2xl px-5 py-4"><div class="font-mono text-xs text-indigo-200 mb-1">${esc(code)}</div><h1 class="text-xl font-extrabold text-white">${esc(S.exam.examName)}</h1><p class="text-indigo-200 text-sm mt-0.5">${S.exam.questions.length} câu${S.dur?' · '+S.dur+' phút':''} · ${S.exam.mode==='test'?'Kiểm tra':'Luyện tập'}</p></div><div class="p-5 space-y-3"><div><label class="block text-sm font-semibold mb-1">Họ tên</label>${inp('_nm','text','Họ tên đầy đủ')}</div><div><label class="block text-sm font-semibold mb-1">SBD/MSSV</label>${inp('_sb','text','Mã số sinh viên')}</div><div class="flex items-start gap-2 bg-amber-50 border border-amber-200 rounded-xl p-3 text-xs text-amber-800"><i data-lucide="eye" class="w-4 h-4 mt-0.5 shrink-0"></i>Bài thi <b>giám sát màn hình</b>: rời tab, chuyển cửa sổ được ghi nhận.</div></div><div class="px-5 pb-5"><button onclick="stuBegin('${code}')" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl font-bold flex items-center justify-center gap-2"><i data-lucide="play" class="w-4 h-4"></i>Bắt đầu làm bài</button></div></div></div>`;
  icons();
  const sess=getSession();if(sess?.role==='student'){$('_nm').value=sess.fullName||'';$('_sb').value=sess.sbd||'';}
}
async function stuBegin(code){
  const name=$('_nm')?.value?.trim(),sbd=$('_sb')?.value?.trim();
  if(!name)return toast('Nhập họ tên','err');
  if(S.exam.classId&&!sbd)return toast('Nhập SBD/MSSV','err');
  const sess=getSession();
  try{const r=await api('startAttempt',{examCode:code,studentName:name,sbd:sbd||'',studentId:sess?.role==='student'?sess.studentId:undefined});S.subId=r.submissionId;S.answers=r.answers||{};M.count=r.tabSwitches||0;if(S.dur>0)S.deadline=new Date(r.startedAt).getTime()+S.dur*60000;if(r.resumed)toast('Tiếp tục bài làm dở');try{await document.documentElement.requestFullscreen();}catch(_){}stuRenderExam();monitorOn();}
  catch(e){toast(e.message,'err');}
}
function stuRenderExam(){$('app').innerHTML=`<div id="_xh" class="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 px-4 py-3 flex items-center justify-between"><div class="min-w-0"><div class="font-bold text-slate-800 text-sm truncate">${esc(S.exam.examName)}</div><div id="_xs" class="text-[11px] text-slate-400">đã lưu</div></div><div id="_xt" class="font-mono font-bold text-lg text-slate-700">${S.dur>0?'--:--':'∞'}</div></div><div id="_xw" class="hidden"></div><div class="max-w-2xl mx-auto px-4 space-y-3 py-4"><div id="_xq"></div><div class="bg-white rounded-2xl border border-slate-200 p-5 text-center"><div class="text-slate-500 mb-3 text-sm">Đã trả lời <b id="_xn">0</b>/${S.exam.questions.length} câu</div><div id="_xd" class="flex flex-wrap justify-center gap-1.5 mb-4"></div><button onclick="stuSubmit(false)" class="px-8 py-3 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl font-bold flex items-center gap-2 mx-auto"><i data-lucide="send" class="w-4 h-4"></i>Nộp bài</button></div></div>`;$('_xq').innerHTML=S.exam.questions.map((q,i)=>stuQHTML(q,i)).join('');stuSync();saveInt=setInterval(stuSave,25000);if(S.dur>0){stuTick();timerInt=setInterval(stuTick,1000);}icons();}
function stuQHTML(q,i){const a=S.answers[q.id];let inner;if(q.type==='mc')inner=q.options.map((o,oi)=>`<label id="ch_${q.id}_${oi}" class="block border rounded-xl px-4 py-3 mb-2 cursor-pointer transition text-sm ${+a===oi?'border-indigo-500 bg-indigo-50/60':'border-slate-200 hover:border-indigo-300'}"><input type="radio" name="${q.id}" ${+a===oi?'checked':''} onchange="stuAns('${q.id}',${oi})" class="mr-2.5 accent-indigo-600">${esc(o)}</label>`).join('');else inner=`<input value="${esc(a==null?'':a)}" oninput="stuAns('${q.id}',this.value)" class="w-full px-4 py-3 border border-slate-200 rounded-xl focus:ring-2 focus:ring-indigo-200 focus:outline-none text-sm" placeholder="Nhập câu trả lời…">`;return `<div class="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><div class="flex gap-2 mb-3"><span class="font-mono font-bold text-indigo-600 shrink-0 text-sm">Câu ${i+1}</span><span class="text-slate-700 whitespace-pre-wrap text-sm">${esc(q.text)}</span></div>${inner}</div>`;}
function stuAns(qid,val){S.answers[qid]=val;const q=S.exam.questions.find(x=>x.id===qid);if(q&&q.type==='mc')q.options.forEach((_,oi)=>{const el=$('ch_'+qid+'_'+oi);if(el)el.className='block border rounded-xl px-4 py-3 mb-2 cursor-pointer transition text-sm '+(+val===oi?'border-indigo-500 bg-indigo-50/60':'border-slate-200 hover:border-indigo-300');});stuSync();const ss=$('_xs');if(ss)ss.textContent='đang lưu…';clearTimeout(saveT);saveT=setTimeout(stuSave,1500);}
function stuAnswered(){return S.exam.questions.filter(q=>S.answers[q.id]!=null&&S.answers[q.id]!=='').length;}
function stuSync(){const n=$('_xn');if(n)n.textContent=stuAnswered();const d=$('_xd');if(!d)return;d.innerHTML=S.exam.questions.map((q,i)=>{const done=S.answers[q.id]!=null&&S.answers[q.id]!=='';return`<button onclick="document.querySelectorAll('#_xq>div')[${i}]?.scrollIntoView({behavior:'smooth',block:'center'})" class="w-8 h-8 rounded-lg text-xs font-bold border ${done?'bg-indigo-600 text-white border-indigo-600':'bg-white text-slate-400 border-slate-200'}">${i+1}</button>`;}).join('');}
async function stuSave(){if(!S.subId)return;try{await api('saveProgress',{submissionId:S.subId,answers:S.answers,progress:stuAnswered()});const s=$('_xs');if(s)s.textContent='đã lưu ✓';}catch(_){const s=$('_xs');if(s)s.textContent='lưu lỗi';}}
function stuTick(){const el=$('_xt');if(!el)return;const left=Math.max(0,Math.round((S.deadline-Date.now())/1000));el.textContent=clock(left);el.className='font-mono font-bold text-lg '+(left<=60?'text-red-600':'text-slate-700');if(left<=0){clearInterval(timerInt);toast('Hết giờ — tự động nộp','warn');stuSubmit(true);}}
async function stuSubmit(auto){M.paused=true;if(!auto){const un=S.exam.questions.length-stuAnswered();if(!confirm(un?`Còn ${un} câu chưa trả lời. Vẫn nộp?`:'Nộp bài?')){M.paused=false;return;}}clearInterval(timerInt);clearInterval(saveInt);clearTimeout(saveT);monitorOff();try{const r=await api('submitExam',{submissionId:S.subId,answers:S.answers});if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});stuResult(r);}catch(e){toast(e.message,'err');M.paused=false;}}
function stuResult(r){const good=r.score>=5;$('app').innerHTML=`<div class="min-h-screen bg-gradient-to-br from-slate-900 to-indigo-950 flex items-center justify-center p-4"><div class="bg-white rounded-2xl shadow-2xl w-full max-w-sm pop p-8 text-center"><div class="text-5xl mb-3">${good?'🎉':'📋'}</div><h2 class="text-xl font-bold text-slate-800 mb-1">Đã nộp bài!</h2><div class="text-6xl font-extrabold font-mono my-4 ${good?'text-emerald-600':'text-amber-600'}">${r.score}<span class="text-2xl text-slate-300">/10</span></div><p class="text-slate-500 text-sm">Đúng ${r.raw}/${r.rawMax} · ${clock(r.timeSpentSec)}${M.count?' · rời màn hình '+M.count+' lần':''}</p><p class="text-slate-400 text-xs mt-3">${S.exam.mode==='practice'?'Có thể đóng trang.':'Kết quả đã gửi về giảng viên.'}</p>${getSession()?.role==='student'?`<button onclick="stuPortal()" class="mt-5 px-6 py-2.5 bg-indigo-600 text-white rounded-xl font-bold text-sm">Về trang của tôi</button>`:''}</div></div>`;}

/* =====================================================================
   MONITOR
   ===================================================================== */
function monitorOn(){M.on=true;M.paused=false;document.addEventListener('visibilitychange',_vis);window.addEventListener('blur',_blur);document.addEventListener('fullscreenchange',_fs);}
function monitorOff(){M.on=false;document.removeEventListener('visibilitychange',_vis);window.removeEventListener('blur',_blur);document.removeEventListener('fullscreenchange',_fs);}
function _vis(){if(document.hidden)monHit('tab_switch','Rời tab / chuyển cửa sổ');}
function _blur(){monHit('blur','Mất tiêu điểm cửa sổ');}
function _fs(){if(!document.fullscreenElement)monHit('fullscreen_exit','Thoát toàn màn hình');}
function monHit(type,detail){if(!M.on||M.paused)return;const now=Date.now();if(now-M.last<1500)return;M.last=now;M.count++;monBanner(M.count);api('reportEvent',{submissionId:S.subId,type,detail}).then(r=>{if(r&&r.tabSwitches){M.count=r.tabSwitches;monBanner(M.count);}}).catch(()=>{});}
function monBanner(n){const b=$('_xw');if(!b)return;b.classList.remove('hidden');b.style.animation='shake .3s';setTimeout(()=>b.style.animation='',300);const sev=n>=3;b.className=`sticky top-[60px] z-20 mx-4 my-2 px-4 py-2.5 rounded-xl text-xs font-semibold flex items-center gap-2 ${sev?'bg-red-600 text-white':'bg-amber-100 text-amber-800 border border-amber-300'}`;b.innerHTML=`<i data-lucide="${sev?'shield-alert':'alert-triangle'}" class="w-4 h-4 shrink-0"></i>Đã ghi nhận rời màn hình <b>${n}</b> lần — giáo viên sẽ thấy.`;icons();}

   START
   ===================================================================== */
window.addEventListener('DOMContentLoaded', boot);
</script>
